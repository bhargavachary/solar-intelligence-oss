name: Update Solar Data (Fixed)

on:
  schedule:
    - cron: '30 1,4,7,10,13 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      
      - name: Setup Chrome environment
        run: |
          # Create directories for Chrome
          mkdir -p /home/runner/.cache/chromium
          mkdir -p /tmp/.X11-unix
          
          # Set environment variables for Chrome
          echo "CHROME_BIN=$(which google-chrome || which chrome || which chromium-browser)" >> $GITHUB_ENV
          echo "DISPLAY=:99" >> $GITHUB_ENV
      
      - name: Create credentials
        run: |
          cat > credentials.json <<'CREDS'
          {
            "username": "${{ secrets.WAAREE_USERNAME }}",
            "password": "${{ secrets.WAAREE_PASSWORD }}",
            "plant_id": "${{ secrets.WAAREE_PLANT_ID }}",
            "plant_capacity_kw": 2.32,
            "daily_realistic_max_kwh": 12.0,
            "location": "Berhampur, Odisha"
          }
          CREDS
      
      - name: Run scraper
        continue-on-error: true
        run: |
          # Set display for headless Chrome
          export DISPLAY=:99
          # Run with timeout and proper error handling
          timeout 180 python waaree_deep_crawler.py 2>&1 | tee scraper.log || echo "Scraper exit code: $?"
          
          # Check if any data was scraped
          if [ -f scraped_data.json ]; then
            echo "✅ Scraper succeeded - scraped_data.json found"
            ls -lh scraped_data.json
          else
            echo "❌ Scraper failed - no scraped_data.json"
            echo "Last 50 lines of log:"
            tail -50 scraper.log || true
          fi
      
      - name: Update data pipeline
        run: |
          if [ -f scraped_data.json ]; then
            python scripts/update_data.py --source live
          else
            echo "No scraped data, skipping update"
          fi
      
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/dashboard_data.json data/energy_logs/*.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Data updated and pushed"
          else
            echo "ℹ️ No changes to commit"
          fi
      
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: |
            diagnostics/
            *.log
          retention-days: 7
          if-no-files-found: ignore
