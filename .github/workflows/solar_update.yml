name: Solar Data Auto-Update

on:
  # Schedule: Runs at 30th minute of hours 1, 4, 7, 10, 13 UTC
  # IST is UTC+5:30.
  # 01:30 UTC = 07:00 IST
  # 04:30 UTC = 10:00 IST
  # 07:30 UTC = 13:00 IST (1 PM)
  # 10:30 UTC = 16:00 IST (4 PM)
  # 13:30 UTC = 19:00 IST (7 PM)
  schedule:
    - cron: '30 1,4,7,10,13 * * *'
  
  # Allows you to run this manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent Pages deployments; do not cancel in-progress deploys.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-solar-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Create Credentials File
      # Write the secret content to credentials.json (script expects this file)
      run: echo '${{ secrets.WAAREE_CREDENTIALS }}' > credentials.json

    - name: Run Update Script
      run: python update_data.py

    - name: Remove Credentials File
      # Security best practice: clean up before committing
      run: rm credentials.json

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 Auto-update: Solar Data (GitHub Actions)"
        file_pattern: "data/* index.html"

  deploy:
    needs: update-solar-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout latest commit
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Upload entire repository
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
